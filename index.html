"ex-02-s4":"SELECT COUNT(*) AS reviews_not_on_delivered_orders FROM reviews r JOIN orders o ON o.order_id = r.order_id WHERE o.order_status <> 'delivered';",
"ex-03-s1":"SELECT COUNT(*) AS valid_orders, COALESCE(SUM(total_amount_idr), 0) AS valid_revenue_idr, ROUND(COALESCE(SUM(total_amount_idr), 0)::NUMERIC / NULLIF(COUNT(*), 0), 2) AS aov_idr FROM orders WHERE order_status NOT IN ('cancelled', 'returned');",
"ex-03-s2":"WITH valid_order_units AS (SELECT o.order_id, SUM(oi.quantity) AS units_sold FROM orders o JOIN order_items oi ON oi.order_id = o.order_id WHERE o.order_status NOT IN ('cancelled', 'returned') GROUP BY o.order_id) SELECT COUNT(*) AS valid_orders_with_items, COALESCE(SUM(units_sold), 0) AS units_sold, ROUND(AVG(units_sold), 2) AS avg_units_per_order FROM valid_order_units;",
"ex-04-s1":"WITH monthly_orders AS (SELECT DATE_TRUNC('month', o.order_date)::DATE AS month, COUNT(*) AS orders, SUM(o.total_amount_idr) AS revenue_idr, AVG(o.total_amount_idr) AS aov_idr FROM orders o WHERE o.order_status NOT IN ('cancelled', 'returned') GROUP BY 1), monthly_units AS (SELECT DATE_TRUNC('month', o.order_date)::DATE AS month, SUM(oi.quantity) AS units_sold FROM orders o JOIN order_items oi ON oi.order_id = o.order_id WHERE o.order_status NOT IN ('cancelled', 'returned') GROUP BY 1), combined AS (SELECT mo.*, mu.units_sold FROM monthly_orders mo JOIN monthly_units mu USING (month)) SELECT month, orders, revenue_idr, units_sold, ROUND(aov_idr, 2) AS aov_idr, LAG(revenue_idr) OVER (ORDER BY month) AS prev_month_revenue_idr, ROUND(100.0 * (revenue_idr - LAG(revenue_idr) OVER (ORDER BY month)) / NULLIF(LAG(revenue_idr) OVER (ORDER BY month), 0), 2) AS revenue_mom_pct, ROUND(100.0 * (orders - LAG(orders) OVER (ORDER BY month)) / NULLIF(LAG(orders) OVER (ORDER BY month), 0), 2) AS orders_mom_pct FROM combined ORDER BY month;",
"ex-05-s1":"WITH valid_orders AS (SELECT * FROM orders WHERE order_status NOT IN ('cancelled', 'returned')), total AS (SELECT SUM(total_amount_idr) AS total_revenue_idr FROM valid_orders) SELECT shipping_province, COUNT(*) AS valid_orders, SUM(total_amount_idr) AS revenue_idr, ROUND(100.0 * SUM(total_amount_idr) / NULLIF(MAX(total.total_revenue_idr), 0), 2) AS revenue_contribution_pct FROM valid_orders CROSS JOIN total GROUP BY shipping_province ORDER BY revenue_idr DESC;",
"ex-05-s2":"SELECT shipping_city, shipping_province, COUNT(*) AS valid_orders, SUM(total_amount_idr) AS revenue_idr FROM orders WHERE order_status NOT IN ('cancelled', 'returned') GROUP BY shipping_city, shipping_province ORDER BY revenue_idr DESC LIMIT 20;",
"ex-05-s3":"SELECT payment_method, COUNT(*) AS valid_orders, SUM(total_amount_idr) AS revenue_idr, ROUND(AVG(total_amount_idr), 2) AS aov_idr FROM orders WHERE order_status NOT IN ('cancelled', 'returned') GROUP BY payment_method ORDER BY revenue_idr DESC;",
"ex-05-s4":"SELECT order_status, COUNT(*) AS orders, ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 2) AS order_share_pct FROM orders GROUP BY order_status ORDER BY orders DESC;",
"ex-06-s1":"WITH product_sales AS (SELECT oi.product_id, SUM(oi.quantity) AS units_sold, SUM(oi.subtotal_idr) AS product_revenue_idr, COUNT(DISTINCT oi.order_id) AS order_count FROM order_items oi JOIN orders o ON o.order_id = oi.order_id WHERE o.order_status NOT IN ('cancelled', 'returned') GROUP BY oi.product_id), ranked AS (SELECT p.product_id, p.name, p.category, p.brand, ps.units_sold, ps.product_revenue_idr, ps.order_count, RANK() OVER (ORDER BY ps.units_sold DESC) AS unit_rank, RANK() OVER (ORDER BY ps.product_revenue_idr DESC) AS revenue_rank FROM product_sales ps JOIN products p ON p.product_id = ps.product_id) SELECT * FROM ranked WHERE unit_rank <= 10 OR revenue_rank <= 10 ORDER BY revenue_rank, unit_rank, product_id;",
"ex-07-s1":"WITH product_clean AS (SELECT product_id, brand, sub_category, CASE WHEN LOWER(TRIM(category)) = 'dress' THEN 'Dress' WHEN LOWER(TRIM(category)) IN ('jacket', 'jaket') THEN 'Jaket' WHEN LOWER(TRIM(category)) = 'kaos' THEN 'Kaos' WHEN LOWER(TRIM(category)) = 'kemeja' THEN 'Kemeja' WHEN LOWER(TRIM(category)) = 't-shirt' THEN 'T-Shirt' ELSE TRIM(category) END AS category_normalized FROM products), sales AS (SELECT pc.category_normalized, pc.sub_category, pc.brand, SUM(oi.quantity) AS units_sold, SUM(oi.subtotal_idr) AS revenue_idr, COUNT(DISTINCT oi.order_id) AS order_count FROM order_items oi JOIN orders o ON o.order_id = oi.order_id JOIN product_clean pc ON pc.product_id = oi.product_id WHERE o.order_status NOT IN ('cancelled', 'returned') GROUP BY pc.category_normalized, pc.sub_category, pc.brand) SELECT * FROM sales ORDER BY revenue_idr DESC;",
"ex-07-s2":"WITH product_clean AS (SELECT product_id, CASE WHEN LOWER(TRIM(category)) = 'dress' THEN 'Dress' WHEN LOWER(TRIM(category)) IN ('jacket', 'jaket') THEN 'Jaket' WHEN LOWER(TRIM(category)) = 'kaos' THEN 'Kaos' WHEN LOWER(TRIM(category)) = 'kemeja' THEN 'Kemeja' WHEN LOWER(TRIM(category)) = 't-shirt' THEN 'T-Shirt' ELSE TRIM(category) END AS category_normalized FROM products), category_sales AS (SELECT pc.category_normalized, SUM(oi.quantity) AS units_sold, SUM(oi.subtotal_idr) AS revenue_idr FROM order_items oi JOIN orders o ON o.order_id = oi.order_id JOIN product_clean pc ON pc.product_id = oi.product_id WHERE o.order_status NOT IN ('cancelled', 'returned') GROUP BY pc.category_normalized) SELECT category_normalized, units_sold, revenue_idr, RANK() OVER (ORDER BY revenue_idr DESC) AS revenue_rank, ROUND(100.0 * revenue_idr / SUM(revenue_idr) OVER (), 2) AS revenue_contribution_pct FROM category_sales ORDER BY revenue_rank;",
"ex-08-s1":"WITH product_sales AS (SELECT oi.product_id, SUM(oi.quantity) AS units_sold FROM order_items oi JOIN orders o ON o.order_id = oi.order_id WHERE o.order_status NOT IN ('cancelled', 'returned') GROUP BY oi.product_id), scored AS (SELECT p.product_id, p.name, p.category, p.brand, p.stock, COALESCE(ps.units_sold, 0) AS units_sold, CASE WHEN p.stock = 0 AND COALESCE(ps.units_sold, 0) > 0 THEN 'Out of stock + sold' WHEN p.stock <= 20 AND COALESCE(ps.units_sold, 0) > 0 THEN 'Low stock + sold' WHEN p.stock >= 150 AND COALESCE(ps.units_sold, 0) <= 5 THEN 'High stock + low/no sales' WHEN COALESCE(ps.units_sold, 0) = 0 THEN 'No recorded valid sales' ELSE 'Other' END AS opportunity_flag FROM products p LEFT JOIN product_sales ps ON ps.product_id = p.product_id) SELECT * FROM scored WHERE opportunity_flag <> 'Other' ORDER BY CASE opportunity_flag WHEN 'Out of stock + sold' THEN 1 WHEN 'Low stock + sold' THEN 2 WHEN 'High stock + low/no sales' THEN 3 WHEN 'No recorded valid sales' THEN 4 ELSE 5 END, units_sold DESC, stock DESC;",
"ex-09-s1":"WITH product_sales AS (SELECT oi.product_id, SUM(oi.quantity) AS units_sold, SUM(oi.subtotal_idr) AS revenue_idr FROM order_items oi JOIN orders o ON o.order_id = oi.order_id WHERE o.order_status NOT IN ('cancelled', 'returned') GROUP BY oi.product_id) SELECT p.product_id, p.name, p.category, p.price_idr AS current_price_idr, p.avg_rating, COALESCE(ps.units_sold, 0) AS units_sold, COALESCE(ps.revenue_idr, 0) AS revenue_idr, CASE WHEN COALESCE(ps.units_sold, 0) >= 20 AND p.avg_rating >= 4.5 THEN 'High sales + high rating' WHEN COALESCE(ps.units_sold, 0) >= 20 AND p.avg_rating < 4.0 THEN 'High sales + lower rating' WHEN COALESCE(ps.units_sold, 0) <= 5 AND p.avg_rating >= 4.5 THEN 'Low sales + high rating' ELSE 'Other' END AS product_signal FROM products p LEFT JOIN product_sales ps ON ps.product_id = p.product_id ORDER BY units_sold DESC, avg_rating DESC;",
"ex-09-s2":"WITH product_sales AS (SELECT oi.product_id, SUM(oi.quantity) AS units_sold FROM order_items oi JOIN orders o ON o.order_id = oi.order_id WHERE o.order_status NOT IN ('cancelled', 'returned') GROUP BY oi.product_id) SELECT CASE WHEN p.price_idr < 250000 THEN '<250K' WHEN p.price_idr < 500000 THEN '250K-<500K' WHEN p.price_idr < 750000 THEN '500K-<750K' ELSE '>=750K' END AS price_band, COUNT(*) AS products, ROUND(AVG(COALESCE(ps.units_sold, 0)), 2) AS avg_units_sold_per_product, SUM(COALESCE(ps.units_sold, 0)) AS total_units_sold FROM products p LEFT JOIN product_sales ps ON ps.product_id = p.product_id GROUP BY 1 ORDER BY MIN(p.price_idr);",
"ex-10-s1":"WITH customer_sales AS (SELECT c.customer_id, c.name, c.gender, c.age_group, c.city, c.province, COUNT(o.order_id) AS valid_order_count, SUM(o.total_amount_idr) AS revenue_idr, MIN(o.order_date) AS first_valid_order_date, MAX(o.order_date) AS last_valid_order_date FROM customers c JOIN orders o ON o.customer_id = c.customer_id WHERE o.order_status NOT IN ('cancelled', 'returned') GROUP BY c.customer_id, c.name, c.gender, c.age_group, c.city, c.province) SELECT COUNT(*) AS buying_customers, ROUND(AVG(valid_order_count), 2) AS avg_orders_per_buying_customer, ROUND(AVG(revenue_idr), 2) AS avg_revenue_per_buying_customer, COUNT(*) FILTER (WHERE valid_order_count = 1) AS one_time_buyers, COUNT(*) FILTER (WHERE valid_order_count > 1) AS repeat_buyers, ROUND(100.0 * COUNT(*) FILTER (WHERE valid_order_count > 1) / NULLIF(COUNT(*), 0), 2) AS repeat_buyer_rate_pct FROM customer_sales;",
"ex-10-s2":"WITH customer_sales AS (SELECT o.customer_id, COUNT(*) AS order_count, SUM(o.total_amount_idr) AS revenue_idr FROM orders o WHERE o.order_status NOT IN ('cancelled', 'returned') GROUP BY o.customer_id), ranked AS (SELECT *, RANK() OVER (ORDER BY revenue_idr DESC) AS revenue_rank, RANK() OVER (ORDER BY order_count DESC) AS order_rank FROM customer_sales) SELECT customer_id, order_count, revenue_idr, revenue_rank, order_rank, revenue_rank + order_rank AS combined_rank_score FROM ranked ORDER BY combined_rank_score, customer_id LIMIT 25;",
"ex-11-s1":"WITH valid_orders AS (SELECT * FROM orders WHERE order_status NOT IN ('cancelled', 'returned')), customer_metrics AS (SELECT customer_id, MAX(order_date) AS last_order_date, COUNT(*) AS frequency, SUM(total_amount_idr) AS monetary FROM valid_orders GROUP BY customer_id), reference_date AS (SELECT MAX(order_date) AS max_order_date FROM valid_orders), scored AS (SELECT cm.*, (rd.max_order_date - cm.last_order_date) AS recency_days, NTILE(4) OVER (ORDER BY cm.last_order_date ASC) AS r_score, NTILE(4) OVER (ORDER BY cm.frequency) AS f_score, NTILE(4) OVER (ORDER BY cm.monetary) AS m_score FROM customer_metrics cm CROSS JOIN reference_date rd) SELECT customer_id, recency_days, frequency, monetary AS revenue_idr, r_score, f_score, m_score, CASE WHEN r_score >= 3 AND f_score >= 3 AND m_score >= 3 THEN 'High-value active' WHEN f_score >= 3 AND m_score >= 3 THEN 'Frequent high-value' WHEN r_score >= 3 THEN 'Recent buyers' WHEN r_score = 1 AND f_score <= 2 AND m_score <= 2 THEN 'Lapsed low-value' ELSE 'Mid-tier' END AS segment FROM scored ORDER BY revenue_idr DESC;",
"ex-12-s1":"WITH valid_orders AS (SELECT customer_id, order_id, order_date FROM orders WHERE order_status NOT IN ('cancelled', 'returned')), first_purchase AS (SELECT customer_id, DATE_TRUNC('month', MIN(order_date))::DATE AS cohort_month FROM valid_orders GROUP BY customer_id), customer_months AS (SELECT DISTINCT vo.customer_id, DATE_TRUNC('month', vo.order_date)::DATE AS purchase_month FROM valid_orders vo), cohort_activity AS (SELECT fp.cohort_month, cm.purchase_month, COUNT(DISTINCT cm.customer_id) AS active_customers FROM first_purchase fp JOIN customer_months cm ON cm.customer_id = fp.customer_id GROUP BY fp.cohort_month, cm.purchase_month), cohort_sizes AS (SELECT cohort_month, COUNT(*) AS cohort_customers FROM first_purchase GROUP BY cohort_month) SELECT ca.cohort_month, ca.purchase_month, ((EXTRACT(YEAR FROM ca.purchase_month) - EXTRACT(YEAR FROM ca.cohort_month)) * 12 + EXTRACT(MONTH FROM ca.purchase_month) - EXTRACT(MONTH FROM ca.cohort_month))::INT AS month_number, cs.cohort_customers, ca.active_customers, ROUND(100.0 * ca.active_customers / NULLIF(cs.cohort_customers, 0), 2) AS retention_rate_pct FROM cohort_activity ca JOIN cohort_sizes cs USING (cohort_month) ORDER BY ca.cohort_month, month_number;",
"ex-13-s1":"WITH valid_orders AS (SELECT * FROM orders WHERE order_status NOT IN ('cancelled', 'returned')), promo_summary AS (SELECT COALESCE(promo_code, 'NO_PROMO') AS promo_code, COUNT(*) AS orders, SUM(total_amount_idr) AS revenue_idr, AVG(total_amount_idr) AS aov_idr, SUM(COALESCE(discount_amount_idr, 0)) AS discount_idr FROM valid_orders GROUP BY COALESCE(promo_code, 'NO_PROMO')) SELECT promo_code, orders, revenue_idr, ROUND(aov_idr, 2) AS aov_idr, discount_idr, ROUND(100.0 * orders / SUM(orders) OVER (), 2) AS order_share_pct FROM promo_summary ORDER BY revenue_idr DESC;",
"ex-13-s2":"SELECT CASE WHEN promo_code IS NULL THEN 'No promo' ELSE 'Promo used' END AS promo_group, COUNT(*) AS valid_orders, SUM(total_amount_idr) AS revenue_idr, ROUND(AVG(total_amount_idr), 2) AS aov_idr, SUM(COALESCE(discount_amount_idr, 0)) AS discount_idr FROM orders WHERE order_status NOT IN ('cancelled', 'returned') GROUP BY 1 ORDER BY 1;",
"ex-14-s1":"WITH promo_items AS (SELECT oi.product_id, oi.quantity, oi.subtotal_idr FROM orders o JOIN order_items oi ON oi.order_id = o.order_id WHERE o.order_status NOT IN ('cancelled', 'returned') AND o.promo_code IS NOT NULL) SELECT p.category, SUM(pi.quantity) AS units_sold, SUM(pi.subtotal_idr) AS item_revenue_idr, COUNT(DISTINCT pi.product_id) AS products_sold FROM promo_items pi JOIN products p ON p.product_id = pi.product_id GROUP BY p.category ORDER BY item_revenue_idr DESC;",
"ex-14-s2":"WITH promo_items AS (SELECT oi.product_id, oi.quantity, oi.subtotal_idr FROM orders o JOIN order_items oi ON oi.order_id = o.order_id WHERE o.order_status NOT IN ('cancelled', 'returned') AND o.promo_code IS NOT NULL) SELECT p.product_id, p.name, p.category, SUM(pi.quantity) AS units_sold, SUM(pi.subtotal_idr) AS item_revenue_idr FROM promo_items pi JOIN products p ON p.product_id = pi.product_id GROUP BY p.product_id, p.name, p.category ORDER BY units_sold DESC, item_revenue_idr DESC LIMIT 20;",
"ex-15-s1":"SELECT courier, COUNT(*) AS orders, COUNT(*) FILTER (WHERE order_status = 'returned') AS returned_orders, COUNT(*) FILTER (WHERE order_status = 'cancelled') AS cancelled_orders, ROUND(100.0 * COUNT(*) FILTER (WHERE order_status = 'returned') / NULLIF(COUNT(*), 0), 2) AS return_rate_pct, ROUND(100.0 * COUNT(*) FILTER (WHERE order_status = 'cancelled') / NULLIF(COUNT(*), 0), 2) AS cancellation_rate_pct, ROUND(AVG(shipping_cost_idr), 2) AS avg_shipping_cost_idr FROM orders GROUP BY courier ORDER BY return_rate_pct DESC, orders DESC;",
"ex-15-s2":"SELECT shipping_province, COUNT(*) AS orders, COUNT(*) FILTER (WHERE order_status = 'returned') AS returned_orders, ROUND(100.0 * COUNT(*) FILTER (WHERE order_status = 'returned') / NULLIF(COUNT(*), 0), 2) AS return_rate_pct, ROUND(AVG(shipping_cost_idr), 2) AS avg_shipping_cost_idr FROM orders GROUP BY shipping_province HAVING COUNT(*) >= 20 ORDER BY return_rate_pct DESC, orders DESC;",
"ex-15-s3":"SELECT courier, shipping_province, COUNT(*) AS orders, COUNT(*) FILTER (WHERE order_status = 'returned') AS returned_orders, ROUND(100.0 * COUNT(*) FILTER (WHERE order_status = 'returned') / NULLIF(COUNT(*), 0), 2) AS return_rate_pct FROM orders GROUP BY courier, shipping_province HAVING COUNT(*) >= 10 ORDER BY return_rate_pct DESC, orders DESC;",
"ex-16-s1":"SELECT rating, COUNT(*) AS review_count, ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 2) AS review_share_pct FROM reviews GROUP BY rating ORDER BY rating;",
"ex-16-s2":"SELECT COUNT(*) AS total_reviews, COUNT(*) FILTER (WHERE review_text IS NULL) AS missing_review_text, ROUND(100.0 * COUNT(*) FILTER (WHERE review_text IS NULL) / NULLIF(COUNT(*), 0), 2) AS missing_text_pct, COUNT(DISTINCT product_id) AS reviewed_products, COUNT(DISTINCT customer_id) AS reviewing_customers FROM reviews;",
"ex-16-s3":"SELECT review_id, product_id, rating, helpful_count, review_date, review_text FROM reviews ORDER BY helpful_count DESC, review_date DESC LIMIT 20;",
"ex-16-s4":"SELECT p.product_id, p.name, p.category, COUNT(r.review_id) AS review_count, ROUND(AVG(r.rating), 2) AS avg_review_rating, SUM(r.helpful_count) AS helpful_votes FROM products p JOIN reviews r ON r.product_id = p.product_id GROUP BY p.product_id, p.name, p.category HAVING COUNT(r.review_id) >= 5 ORDER BY avg_review_rating ASC, review_count DESC;",
"ex-17-s1":"WITH sales AS (SELECT oi.product_id, SUM(oi.quantity) AS units_sold, SUM(oi.subtotal_idr) AS revenue_idr FROM order_items oi JOIN orders o ON o.order_id = oi.order_id WHERE o.order_status NOT IN ('cancelled', 'returned') GROUP BY oi.product_id), review_stats AS (SELECT product_id, COUNT(*) AS review_count, AVG(rating) AS avg_review_rating FROM reviews GROUP BY product_id), product_metrics AS (SELECT p.product_id, p.name, p.category, COALESCE(s.units_sold, 0) AS units_sold, COALESCE(s.revenue_idr, 0) AS revenue_idr, rs.review_count, rs.avg_review_rating FROM products p LEFT JOIN sales s ON s.product_id = p.product_id LEFT JOIN review_stats rs ON rs.product_id = p.product_id) SELECT *, RANK() OVER (ORDER BY units_sold DESC) AS sales_rank, RANK() OVER (ORDER BY avg_review_rating DESC NULLS LAST) AS rating_rank, CASE WHEN avg_review_rating >= 4.5 AND units_sold <= 5 THEN 'High rating + low sales' WHEN avg_review_rating < 3.5 AND units_sold >= 20 THEN 'Lower rating + high sales' ELSE 'Other' END AS experience_signal FROM product_metrics WHERE review_count IS NOT NULL ORDER BY CASE WHEN (CASE WHEN avg_review_rating >= 4.5 AND units_sold <= 5 THEN 'High rating + low sales' WHEN avg_review_rating < 3.5 AND units_sold >= 20 THEN 'Lower rating + high sales' ELSE 'Other' END) <> 'Other' THEN 0 ELSE 1 END, avg_review_rating DESC NULLS LAST, units_sold DESC;",
"ex-18-s1":"WITH valid_order_products AS (SELECT DISTINCT oi.order_id, oi.product_id FROM order_items oi JOIN orders o ON o.order_id = oi.order_id WHERE o.order_status NOT IN ('cancelled', 'returned')), pairs AS (SELECT a.product_id AS product_a, b.product_id AS product_b, COUNT(*) AS order_pair_count FROM valid_order_products a JOIN valid_order_products b ON a.order_id = b.order_id AND a.product_id < b.product_id GROUP BY a.product_id, b.product_id) SELECT p1.name AS product_a, p2.name AS product_b, pairs.order_pair_count, RANK() OVER (ORDER BY pairs.order_pair_count DESC) AS pair_rank FROM pairs JOIN products p1 ON p1.product_id = pairs.product_a JOIN products p2 ON p2.product_id = pairs.product_b ORDER BY pair_rank, product_a, product_b LIMIT 30;",
"ex-19-s1":"WITH customer_orders AS (SELECT o.order_id, o.customer_id, COUNT(*) OVER (PARTITION BY o.customer_id) AS customer_order_count, SUM(o.total_amount_idr) OVER (PARTITION BY o.customer_id) AS customer_revenue FROM orders o WHERE o.order_status NOT IN ('cancelled', 'returned')), customer_segment AS (SELECT DISTINCT customer_id, CASE WHEN customer_order_count >= 5 AND customer_revenue >= 5000000 THEN 'High-value repeat' WHEN customer_order_count >= 2 THEN 'Repeat' ELSE 'One-time' END AS customer_segment FROM customer_orders), product_clean AS (SELECT product_id, CASE WHEN LOWER(TRIM(category)) = 'dress' THEN 'Dress' WHEN LOWER(TRIM(category)) IN ('jacket', 'jaket') THEN 'Jaket' WHEN LOWER(TRIM(category)) = 'kaos' THEN 'Kaos' WHEN LOWER(TRIM(category)) = 'kemeja' THEN 'Kemeja' WHEN LOWER(TRIM(category)) = 't-shirt' THEN 'T-Shirt' ELSE TRIM(category) END AS category_normalized FROM products) SELECT cs.customer_segment, pc.category_normalized, COUNT(DISTINCT co.customer_id) AS customers, SUM(oi.quantity) AS units_sold, SUM(oi.subtotal_idr) AS item_revenue_idr, RANK() OVER (PARTITION BY cs.customer_segment ORDER BY SUM(oi.subtotal_idr) DESC) AS category_rank_within_segment FROM customer_orders co JOIN customer_segment cs ON cs.customer_id = co.customer_id JOIN order_items oi ON oi.order_id = co.order_id JOIN product_clean pc ON pc.product_id = oi.product_id GROUP BY cs.customer_segment, pc.category_normalized ORDER BY cs.customer_segment, category_rank_within_segment;",
"ex-20-s1":"WITH sales AS (SELECT oi.product_id, SUM(oi.quantity) AS units_sold FROM order_items oi JOIN orders o ON o.order_id = oi.order_id WHERE o.order_status NOT IN ('cancelled', 'returned') GROUP BY oi.product_id) SELECT p.product_id, p.name, p.brand, p.stock, COALESCE(s.units_sold, 0) AS units_sold, 'RESTOCK_REVIEW' AS action_signal FROM products p LEFT JOIN sales s ON s.product_id = p.product_id WHERE COALESCE(s.units_sold, 0) > 0 AND p.stock <= 20 ORDER BY units_sold DESC, stock ASC;",
"ex-20-s2":"WITH sales AS (SELECT oi.product_id, SUM(oi.quantity) AS units_sold FROM order_items oi JOIN orders o ON o.order_id = oi.order_id WHERE o.order_status NOT IN ('cancelled', 'returned') GROUP BY oi.product_id) SELECT p.product_id, p.name, p.brand, p.stock, COALESCE(s.units_sold, 0) AS units_sold, 'DEAD_STOCK_REVIEW' AS action_signal FROM products p LEFT JOIN sales s ON s.product_id = p.product_id WHERE p.stock >= 150 AND COALESCE(s.units_sold, 0) <= 5 ORDER BY stock DESC, units_sold ASC;",
"ex-20-s3":"SELECT courier, shipping_province, COUNT(*) AS orders, COUNT(*) FILTER (WHERE order_status = 'returned') AS returned_orders, ROUND(100.0 * COUNT(*) FILTER (WHERE order_status = 'returned') / NULLIF(COUNT(*), 0), 2) AS return_rate_pct, 'LOGISTICS_REVIEW' AS action_signal FROM orders GROUP BY courier, shipping_province HAVING COUNT(*) >= 10 ORDER BY return_rate_pct DESC, orders DESC;"
};

   STATE
   ============================================================ */
const STORAGE_KEY = "gayanara_sql_practice_lab_v2";
const OLD_STORAGE_KEY = "gayanara_sql_practice_lab_v1";

// Backend base URL — empty means "auto-detect" (try localhost:8765, then report unavailable).
// Set explicitly if the backend runs on a different port or host.
const BACKEND_BASE = "https://gayanara-sql-practice-lab-api-subhan.onrender.com";  // Render API

let state = {
  answers: {},
  notes: {},
  completed: {},
  validation: {},   // { subId: { status, message, at, query } } — separate from answers
  currentView: "dashboard",
  expandedParents: {},
  filters: { search: "", difficulty: "", category: "", status: "" }
};

let submittingSubId = null;  // guard against concurrent submissions

let localStorageAvailable = true;
let totalSubs = 0;

/* Count all sub-exercises */
for (const p of PARENTS) totalSubs += p.subs.length;

/* Build a flat lookup for sub-exercises */
const SUB_MAP = {};
for (const p of PARENTS) {
  for (const s of p.subs) {
    SUB_MAP[s.id] = { sub: s, parent: p };
  }
}
const ALL_SUBS = Object.values(SUB_MAP);

/* ============================================================
   PERSISTENCE + MIGRATION
   ============================================================ */
function loadState() {
  // Try new key first
  let migrated = false;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === "object") {
        state.answers = parsed.answers || {};
        state.notes = parsed.notes || {};
        state.completed = parsed.completed || {};
        state.validation = parsed.validation || {};
      }
    }
  } catch(e) {
    localStorageAvailable = false;
  }

  // If no new data, try old key and migrate
  if (!localStorageAvailable) {
    showToast("LocalStorage is unavailable. Progress will not persist between sessions.", "error");
    return;
  }
  if (Object.keys(state.answers).length === 0) {
    try {
      const oldRaw = localStorage.getItem(OLD_STORAGE_KEY);
      if (oldRaw) {
        const oldParsed = JSON.parse(oldRaw);
        if (oldParsed && oldParsed.answers) {
          // Migrate: for each old parent key, if no sub answers exist, assign to first sub
          for (const [oldKey, val] of Object.entries(oldParsed.answers)) {
            if (val && val.trim() && !state.answers[oldKey]) {
              // Find the parent and assign to first sub
              const parent = PARENTS.find(p => p.id === oldKey);
              if (parent && parent.subs.length > 0) {
                const firstSubId = parent.subs[0].id;
                if (!state.answers[firstSubId]) {
                  state.answers[firstSubId] = val;
                }
              }
            }
          }
          if (oldParsed.notes) {
            for (const [oldKey, val] of Object.entries(oldParsed.notes)) {
              if (val && !state.notes[oldKey]) {
                const parent = PARENTS.find(p => p.id === oldKey);
                if (parent && parent.subs.length > 0) {
                  state.notes[parent.subs[0].id] = val;
                }
              }
            }
          }
          if (oldParsed.completed) {
            for (const oldKey of Object.keys(oldParsed.completed)) {
              if (oldParsed.completed[oldKey] && !state.completed[oldKey]) {
                const parent = PARENTS.find(p => p.id === oldKey);
                if (parent && parent.subs.length > 0) {
                  state.completed[parent.subs[0].id] = true;
                }
              }
            }
          }
          migrated = true;
        }
      }
    } catch(e) { /* ignore old key errors */ }
  }

  if (migrated) {
    saveState();
    showToast("Your previous answers have been migrated. They were assigned to the first sub-exercise of each parent. Review and redistribute as needed.", "success");
  }
}

function saveState() {
  if (!localStorageAvailable) return;
  try {
    const data = { answers: state.answers, notes: state.notes, completed: state.completed, validation: state.validation };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) {
    showToast("Failed to save progress. Storage may be full or blocked.", "error");
  }
}

/* ============================================================
   UTILITIES
   ============================================================ */
function esc(s) {
  if (s == null) return "";
  const d = document.createElement("div");
  d.textContent = String(s);
  return d.innerHTML;
}

function showToast(msg, type) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast visible " + (type || "");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = "toast"; }, 4000);
}

function getProgress() {
  const total = totalSubs;
  const completed = ALL_SUBS.filter(s => state.completed[s.sub.id]).length;
  const saved = ALL_SUBS.filter(s => state.answers[s.sub.id] && state.answers[s.sub.id].trim() !== "").length;
  const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
  return { total, completed, saved, pct };
}

function getParentProgress(parent) {
  const total = parent.subs.length;
  const done = parent.subs.filter(s => state.completed[s.id]).length;
  return { total, done, pct: total > 0 ? Math.round((done/total)*100) : 0 };
}

function getFilteredSubs() {
  let list = [...ALL_SUBS];
  const { search, difficulty, category, status } = state.filters;
  if (search) {
    const q = search.toLowerCase();
    list = list.filter(({sub, parent}) =>
      sub.title.toLowerCase().includes(q) ||
      sub.question.toLowerCase().includes(q) ||
      parent.title.toLowerCase().includes(q) ||
      parent.sourceFile.toLowerCase().includes(q) ||
      parent.concepts.some(c => c.toLowerCase().includes(q)) ||
      parent.category.toLowerCase().includes(q)
    );
  }
  if (difficulty) list = list.filter(({parent}) => parent.difficulty === difficulty);
  if (category) list = list.filter(({parent}) => parent.category === category);
  if (status === "completed") list = list.filter(({sub}) => state.completed[sub.id]);
  else if (status === "saved") list = list.filter(({sub}) => state.answers[sub.id] && state.answers[sub.id].trim() && !state.completed[sub.id]);
  else if (status === "unsaved") list = list.filter(({sub}) => !state.answers[sub.id] && !state.completed[sub.id]);
  return list;
}

/* ============================================================
   RENDER: SIDEBAR
   ============================================================ */
function renderSidebar() {
  const nav = document.getElementById("sidebarNav");
  let html = `<button class="nav-item${state.currentView==='dashboard'?' active':''}" onclick="navigateTo('dashboard')">
    <span class="indicator"></span>Dashboard
  </button>`;

  for (const cat of CATEGORIES) {
    const catParents = PARENTS.filter(p => p.category === cat);
    if (catParents.length === 0) continue;
    html += `<div class="nav-section"><div class="nav-section-title">${esc(cat)}</div>`;
    for (const p of catParents) {
      const pp = getParentProgress(p);
      const isCurrent = state.currentView === p.id || (SUB_MAP[state.currentView] && SUB_MAP[state.currentView].parent.id === p.id);
      const expanded = state.expandedParents[p.id] || isCurrent;
      const activeClass = isCurrent ? " active" : "";
      const expandedClass = expanded ? " expanded" : "";
      const progressClass = pp.done === pp.total && pp.total > 0 ? " full" : "";
      html += `<button class="nav-parent${activeClass}${expandedClass}" onclick="toggleParent('${p.id}')">
        <span class="parent-title">${esc(p.title)}</span>
        <span class="parent-progress${progressClass}">${pp.done}/${pp.total}</span>
        <span class="expand-arrow">&#9654;</span>
      </button>`;
      if (expanded) {
        for (const s of p.subs) {
          const subActive = state.currentView === s.id ? " active" : "";
          let indClass = "";
          if (state.completed[s.id]) indClass = "completed";
          else if (state.answers[s.id] && state.answers[s.id].trim()) indClass = "saved";
          html += `<button class="nav-sub${subActive}" onclick="event.stopPropagation();navigateTo('${s.id}')">
            <span class="indicator ${indClass}"></span>${esc(s.title)}
          </button>`;
        }
      }
    }
    html += `</div>`;
  }
  nav.innerHTML = html;

  const pr = getProgress();
  document.getElementById("overallProgress").style.width = pr.pct + "%";
  document.getElementById("overallProgressText").textContent = `${pr.completed} / ${pr.total} sub-exercises completed`;
}

/* ============================================================
   RENDER: DASHBOARD
   ============================================================ */

  const main = document.getElementById("mainContent");
  const pr = getProgress();
  let html = `
    <div class="page-header">
      <h2>Dashboard</h2>
      <div class="subtitle">Your Gayanara SQL practice workspace. ${pr.total} sub-exercises across ${PARENTS.length} parent topics.</div>
      <div class="dataset-source">
        Dataset Source:
        <a href="https://ngulikdata.com/datasets/gayanara"
           target="_blank"
           rel="noopener noreferrer">Ngulikdata</a>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn" onclick="exportProgress()">Export Progress (JSON)</button>
      <button class="btn" onclick="importProgress()">Import Progress (JSON)</button>
      <button class="btn btn-danger" onclick="resetAllProgress()">Reset All</button>
    </div>
    <div class="dashboard-grid">
      <div class="stat-card"><div class="label">Overall Progress</div><div class="value">${pr.pct}%</div><div class="sub">${pr.completed} of ${pr.total} sub-exercises completed</div></div>
      <div class="stat-card"><div class="label">Answers Saved</div><div class="value">${pr.saved}</div><div class="sub">Sub-exercises with saved SQL</div></div>

    </div>
    <div class="category-progress"><h3>Progress by Category</h3>`;

  for (const cat of CATEGORIES) {
    const catSubs = ALL_SUBS.filter(s => s.parent.category === cat);
    if (catSubs.length === 0) continue;
    const done = catSubs.filter(s => state.completed[s.sub.id]).length;
    const pct = catSubs.length > 0 ? Math.round(done / catSubs.length * 100) : 0;
    html += `<div class="cat-progress-row"><span class="cat-name">${esc(cat)}</span><div class="cat-bar"><div class="cat-fill" style="width:${pct}%"></div></div><span class="cat-pct">${done}/${catSubs.length}</span></div>`;
  }

  html += `</div>
    <div class="filters-bar">
      <input type="search" id="filterSearch" placeholder="Search sub-exercises by title, question, file, or concept..." value="${esc(state.filters.search)}" oninput="onSearchInput(this.value)" aria-label="Search">
      <select id="filterDifficulty" onchange="onFilterChange()" aria-label="Difficulty">
        <option value="">All difficulties</option>
        <option value="Beginner"${state.filters.difficulty==='Beginner'?' selected':''}>Beginner</option>
        <option value="Intermediate"${state.filters.difficulty==='Intermediate'?' selected':''}>Intermediate</option>
        <option value="Advanced"${state.filters.difficulty==='Advanced'?' selected':''}>Advanced</option>
      </select>
      <select id="filterCategory" onchange="onFilterChange()" aria-label="Category">
        <option value="">All categories</option>
        ${CATEGORIES.map(c=>`<option value="${esc(c)}"${state.filters.category===c?' selected':''}>${esc(c)}</option>`).join("")}
      </select>
      <select id="filterStatus" onchange="onFilterChange()" aria-label="Status">
        <option value="">All statuses</option>
        <option value="completed"${state.filters.status==='completed'?' selected':''}>Completed</option>
        <option value="saved"${state.filters.status==='saved'?' selected':''}>Has saved answer</option>
        <option value="unsaved"${state.filters.status==='unsaved'?' selected':''}>No answer yet</option>
      </select>
    </div>
    <div id="exerciseList">`;

  const filtered = getFilteredSubs();
  if (filtered.length === 0) {
    html += `<div class="empty-state"><h3>No sub-exercises match your filters</h3><p>Try adjusting the search or filter criteria.</p></div>`;
  } else {
    // Group by parent for display
    const grouped = {};
    for (const {sub, parent} of filtered) {
      if (!grouped[parent.id]) grouped[parent.id] = { parent, subs: [] };
      grouped[parent.id].subs.push(sub);
    }
    for (const pid in grouped) {
      const {parent, subs} = grouped[pid];
      const pp = getParentProgress(parent);
      html += `<div style="margin-bottom:12px;">
        <div style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;padding:4px 0;">
          <span class="badge badge-${parent.difficulty.toLowerCase()}">${parent.difficulty}</span>
          ${esc(parent.title)} <span style="font-size:11px;color:var(--text-muted);">(${pp.done}/${pp.total} complete)</span>
        </div>`;
      for (const s of subs) {
        const status = state.completed[s.id] ? "completed" : (state.answers[s.id]&&state.answers[s.id].trim()?"saved":"pending");
        const statusLabel = state.completed[s.id]?"Completed":(state.answers[s.id]&&state.answers[s.id].trim()?"Answer saved":"Not started");
        html += `<div class="sub-list-item" onclick="navigateTo('${s.id}')">
          <span class="sub-num">${s.id.split('-s')[1]}</span>
          <span class="sub-title">${esc(s.title)}</span>
          <span class="sub-status ${status}">${statusLabel}</span>
        </div>`;
      }
      html += `</div>`;
    }
  }
  html += `</div>`;
  main.innerHTML = html;
}

/* ============================================================
   ACTIONS
   ============================================================ */
function navigateTo(view) {
  state.currentView = view;
  // Expand the parent in the sidebar if navigating to a sub-exercise
  if (SUB_MAP[view]) {
    state.expandedParents[SUB_MAP[view].parent.id] = true;
  }
  renderSidebar();
  if (view === "dashboard") renderDashboard();
  else if (PARENTS.find(p=>p.id===view)) renderParent(view);
  else if (SUB_MAP[view]) renderSub(view);
  else renderDashboard();
  window.scrollTo(0,0);
}

function toggleParent(pid) {
  // Clicking a parent always opens its overview page and reveals its
  // sub-exercises in the sidebar.
  state.expandedParents[pid] = true;
  navigateTo(pid);
}

function copyAnswer(subId) {
  const text = state.answers[subId] || "";
  if (!text.trim()) { showToast("No SQL to copy. Write your answer first.", "error"); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(()=>showToast("SQL copied. Paste into pgAdmin 4 to execute.","success")).catch(()=>fallbackCopy(text));
  } else fallbackCopy(text);
}

function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.left="-9999px";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); showToast("SQL copied. Paste into pgAdmin 4 to execute.","success"); }
  catch(e) { showToast("Copy failed. Select and copy manually.","error"); }
  document.body.removeChild(ta);
}

function saveAnswer(subId) {
  const editor = document.getElementById("sqlEditor");
  if (!editor) return;
  const val = editor.value;
  if (val.trim()==="") delete state.answers[subId];
  else state.answers[subId] = val;
  saveState();
  const st = document.getElementById("saveStatus");
  if (st) { st.textContent = val.trim()?"Answer saved":"No answer saved"; st.className = "save-status " + (val.trim()?"saved":"unsaved"); }
  renderSidebar();
  showToast("Answer saved to browser storage.","success");
}

function resetAnswer(subId) {
  if (!confirm("Clear your saved answer for this sub-exercise? This cannot be undone.")) return;
  delete state.answers[subId];
  saveState();
  renderSub(subId);
  renderSidebar();
  showToast("Answer cleared.","success");
}

function toggleComplete(subId, checked) {
  if (checked) state.completed[subId] = true;
  else delete state.completed[subId];
  saveState();
  renderSidebar();
  if (checked) showToast("Sub-exercise marked as completed.","success");
}

function saveNotes(subId) {
  const ed = document.getElementById("notesEditor");
  if (!ed) return;
  if (ed.value.trim()==="") delete state.notes[subId];
  else state.notes[subId] = ed.value;
  saveState();
  showToast("Notes saved.","success");
}

function toggleSourceSql(el) {
  const c = el.nextElementSibling;
  const open = c.classList.contains("visible");
  c.classList.toggle("visible");
  el.classList.toggle("open");
  el.setAttribute("aria-expanded", String(!open));
}

/* ============================================================
   QUERY SUBMISSION + RESULT VALIDATION
   ============================================================ */
const VALIDATION_LABELS = {
  correct: "Correct",
  technique: "Correct Result — Required Technique Not Used",
  incorrect: "Incorrect",
  error: "Execution Error",
  unavailable: "Validation Unavailable",
  running: "Running…"
};

function getBackendBase() {
  if (BACKEND_BASE) return BACKEND_BASE;
  // Auto-detect: same origin if served, else localhost
  if (location.protocol !== "file:") return location.origin;
  return "http://127.0.0.1:8765";
}


async function runUserQuery(subId) {
  if (submittingSubId) return;
  const editor = document.getElementById("sqlEditor");
  const runBtn = document.getElementById("runQueryBtn");
  const status = document.getElementById("queryStatus");
  const results = document.getElementById("queryResults");
  const meta = document.getElementById("queryResultsMeta");
  if (!editor || !runBtn || !status || !results || !meta) return;
  const sql = editor.value.trim();
  if (!sql) {
    status.className = "query-status-banner error";
    status.textContent = "Enter a SELECT query before running it.";
    return;
  }
  submittingSubId = subId;
  runBtn.disabled = true;
  runBtn.textContent = "Running query…";
  status.className = "query-status-banner info";
  status.textContent = "Executing your query against the Gayanara PostgreSQL database…";
  results.textContent = "Running query…";
  meta.textContent = "Executing…";
  try {
    const response = await fetch(getBackendBase() + "/api/query", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({sql})
    });
    const data = await response.json().catch(() => ({error:"Invalid response from query service."}));
    if (!response.ok) {
      const detail = data.detail ? "\n" + data.detail : "";
      throw new Error((data.error || "Query failed (HTTP " + response.status + ").") + detail);
    }
    renderQueryResults(data);
    status.className = "query-status-banner success";
    status.textContent = data.truncated
      ? "Query executed successfully. Displayed results were truncated by the server limit."
      : "Query executed successfully.";
    state.answers[subId] = sql;
    saveState();
    renderSidebar();
  } catch (error) {
    results.textContent = "No results available. Fix the SQL or check the database connection and try again.";
    meta.textContent = "Query failed";
    status.className = "query-status-banner error";
    status.textContent = error.message || "Query execution failed.";
  } finally {
    submittingSubId = null;
    runBtn.disabled = false;
    runBtn.textContent = "Run Query";
  }
}

function renderQueryResults(data) {
  const wrap = document.getElementById("queryResults");
  const meta = document.getElementById("queryResultsMeta");
  if (!wrap || !meta) return;
  const columns = Array.isArray(data.columns) ? data.columns : [];
  const rows = Array.isArray(data.rows) ? data.rows : [];
  wrap.replaceChildren();
  if (!columns.length) {
    wrap.textContent = "The query did not return a result table.";
    meta.textContent = "No result columns";
    return;
  }
  const table = document.createElement("table");
  table.className = "query-results-table";
  const thead = document.createElement("thead");
  const header = document.createElement("tr");
  columns.forEach(col => {
    const th = document.createElement("th");
    th.textContent = String(col);
    header.appendChild(th);
  });
  thead.appendChild(header);
  table.appendChild(thead);
  const tbody = document.createElement("tbody");
  rows.forEach(row => {
    const tr = document.createElement("tr");
    columns.forEach((_, i) => {
      const td = document.createElement("td");
      const value = Array.isArray(row) ? row[i] : null;
      if (value === null || value === undefined) {
        td.textContent = "NULL";
        td.className = "null-value";
      } else if (typeof value === "object") td.textContent = JSON.stringify(value);
      else td.textContent = String(value);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  if (!rows.length) {
    const empty = document.createElement("div");
    empty.className = "query-results-empty";
    empty.textContent = "Query executed successfully: zero rows returned.";
    wrap.appendChild(empty);
  }
  const count = Number.isFinite(Number(data.rowCount)) ? Number(data.rowCount) : rows.length;
  const elapsed = Number.isFinite(Number(data.elapsed_ms)) ? Number(data.elapsed_ms) : null;
  meta.textContent = count.toLocaleString() + " rows · " + columns.length + " columns" +
    (elapsed === null ? "" : " · " + elapsed + " ms") + (data.truncated ? " · truncated" : "");
}

async function submitQuery(subId) {
  if (submittingSubId) return;  // prevent concurrent submissions
  const editor = document.getElementById("sqlEditor");
  const banner = document.getElementById("validationBanner");
  const btn = document.getElementById("submitBtn");
  if (!editor || !banner || !btn) return;

  const sql = editor.value.trim();
  if (!sql) {
    banner.className = "validation-banner visible error";
    banner.innerHTML = `<div class="vb-head"><span class="vb-icon">⚠</span> No SQL entered</div><div class="vb-detail">Write a query in the editor before submitting.</div>`;
    return;
  }

  const refSql = REF_SQL[subId];
  if (!refSql) {
    banner.className = "validation-banner visible unavailable";
    banner.innerHTML = `<div class="vb-head"><span class="vb-icon">ℹ</span> Validation Unavailable</div><div class="vb-detail">No reference query is defined for this sub-exercise. You can still write and copy your answer, but automatic validation is not available.</div>`;
    return;
  }

  // Show running state
  submittingSubId = subId;
  btn.disabled = true;
  btn.textContent = "Submitting…";
  banner.className = "validation-banner visible running";
  banner.innerHTML = `<div class="vb-head"><span class="vb-spin"></span> Running your query against the database…</div>`;

  try {
    const resp = await fetch(getBackendBase() + "/validate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_sql: sql, sub_id: subId })
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ error: "Backend error" }));
      // Distinguish user SQL errors (422/408) from infrastructure problems.
      if (resp.status === 422 || resp.status === 408) {
        banner.className = "validation-banner visible error";
        banner.innerHTML = `<div class="vb-head"><span class="vb-icon">\u26A0</span> Execution Error</div>
          <div class="vb-detail">${esc(err.error || "PostgreSQL rejected your query.")}</div>` +
          (err.detail ? `<div style="margin-top:6px;font-family:var(--font-mono);font-size:12px;color:#92400e;">${esc(err.detail)}</div>` : "");
        state.validation[subId] = { status: "error", message: err.error, at: new Date().toISOString(), query: sql };
        saveState();
        return; // handled — finally still resets the button
      }
      // 503 / 500 / network = infrastructure problem → let it fall through to catch
      throw new Error(err.error || "Request failed (HTTP " + resp.status + ")");
    }

    const data = await resp.json();
    const result = compareResults(data.user, data.reference, subId);
    // Check required-technique requirements (best-effort regex hint)
    if (result.status === "correct") {
      const techs = TECHNIQUE_REQS[subId];
      if (techs) {
        const missing = techs.filter(t => {
          try { return !new RegExp(t.pattern, "i").test(sql); }
          catch (_) { return false; }
        });
        if (missing.length > 0) {
          result.status = "technique";
          result.techniqueNote = missing.map(t => t.label).join("; ");
        }
      }
    }
    displayValidation(subId, result, data);
    state.validation[subId] = {
      status: result.status,
      message: result.summary,
      detail: result.details,
      at: new Date().toISOString(),
      query: sql
    };
    saveState();

  } catch (err) {
    // Network error or backend not reachable
    banner.className = "validation-banner visible unavailable";
    const msg = err.message || String(err);
    let detail = "Could not reach the validation backend. ";
    if (msg.includes("Failed to fetch") || msg.includes("NetworkError")) {
      detail += "Make sure the backend is running (python server.py) and the database is accessible. See the backend instructions in the project README.";
    } else if (msg.includes("read only") || msg.includes("permission")) {
      detail += "The database connection may lack read access to the required tables.";
    } else {
      detail += msg;
    }
    banner.innerHTML = `<div class="vb-head"><span class="vb-icon">ℹ</span> Validation Unavailable</div><div class="vb-detail">${esc(detail)}</div>`;
    state.validation[subId] = { status: "unavailable", message: "Backend unreachable: " + msg, at: new Date().toISOString(), query: sql };
    saveState();
  } finally {
    submittingSubId = null;
    btn.disabled = false;
    btn.textContent = "Submit Query";
  }
}

function compareResults(user, reference, subId) {
  const userCols = user.columns || [];
  const refCols = reference.columns || [];
  const userRows = user.rows || [];
  const refRows = reference.rows || [];

  const issues = [];
  let status = "correct";

  // 1. Column count check
  if (userCols.length !== refCols.length) {
    status = "incorrect";
    issues.push(`Column count differs: your query returned ${userCols.length} column(s), expected ${refCols.length}.`);
  }

  // 2. Row count check
  if (userRows.length !== refRows.length) {
    status = "incorrect";
    issues.push(`Row count differs: your query returned ${userRows.length} row(s), expected ${refRows.length}.`);
  }

  // 3. Value comparison (order-insensitive unless the sub-exercise requires order)
  if (userRows.length === refRows.length && userCols.length === refCols.length) {
    const ordered = requiresOrder(subId);
    let valueIssues = [];
    if (ordered) {
      // Compare row-by-row in order
      for (let i = 0; i < refRows.length; i++) {
        const diffs = rowDiff(userRows[i], refRows[i], refCols);
        if (diffs.length) valueIssues.push({ row: i, diffs });
      }
    } else {
      // Order-insensitive: build multiset comparison
      const refMultiset = new Map();
      for (const row of refRows) {
        const key = rowKey(row);
        refMultiset.set(key, (refMultiset.get(key) || 0) + 1);
      }
      const userMultiset = new Map();
      for (const row of userRows) {
        const key = rowKey(row);
        userMultiset.set(key, (userMultiset.get(key) || 0) + 1);
      }
      // Find rows in user but not in ref (or extra)
      for (const [key, count] of userMultiset) {
        const refCount = refMultiset.get(key) || 0;
        if (count > refCount) {
          valueIssues.push({ row: -1, diffs: [`Unexpected row (or extra duplicate): [${rowDisplay(key)}] ×${count - refCount}`] });
        }
      }
      // Find rows in ref but not in user
      for (const [key, count] of refMultiset) {
        const userCount = userMultiset.get(key) || 0;
        if (count > userCount) {
          valueIssues.push({ row: -1, diffs: [`Missing row (or missing duplicate): [${rowDisplay(key)}] ×${count - userCount}`] });
        }
      }
    }
    if (valueIssues.length > 0) {
      status = "incorrect";
      const shown = valueIssues.slice(0, 5);
      for (const vi of shown) {
        if (vi.row >= 0) {
          issues.push(`Row ${vi.row + 1}: ` + vi.diffs.join("; "));
        } else {
          issues.push(vi.diffs.join("; "));
        }
      }
      if (valueIssues.length > 5) issues.push(`…and ${valueIssues.length - 5} more difference(s).`);
    }
  }

  // 4. Truncation warning
  if (user.truncated) issues.push("Your result was truncated at 10,000 rows. The comparison may be incomplete.");
  if (reference.truncated) issues.push("Reference result was truncated at 10,000 rows.");

  const summary = status === "correct"
    ? "Your query result matches the reference."
    : issues.join(" ");

  return { status, summary, details: issues, refCols, userCols, refRowCount: refRows.length, userRowCount: userRows.length };
}

function requiresOrder(subId) {
  // Check if the sub-exercise's expected output specifies a non-trivial sort order
  const entry = SUB_MAP[subId];
  if (!entry) return false;
  const so = entry.sub.expectedOutput.sortOrder || "";
  // "N/A" means no ordering requirement
  if (so === "N/A" || so === "n/a" || so === "") return false;
  return true;
}

function rowKey(row) {
  // Use \u0000 as the null marker and \u001F (unit separator) between cells.
  return row.map(v => v === null ? "\u0000NULL\u0000" : String(v)).join("\u001F");
}

function rowDisplay(key) {
  return key.split("\u001F").map(v => v === "\u0000NULL\u0000" ? "NULL" : v).join(", ");
}

function rowDiff(userRow, refRow, refCols) {
  const diffs = [];
  for (let i = 0; i < refCols.length; i++) {
    const u = userRow[i];
    const r = refRow[i];
    if (valuesEqual(u, r)) continue;
    diffs.push(`${refCols[i]}: got ${fmtVal(u)}, expected ${fmtVal(r)}`);
  }
  return diffs;
}

function valuesEqual(a, b) {
  // Both null
  if (a == null && b == null) return true;
  if (a == null || b == null) return false;
  // Numeric comparison: if both can be parsed as numbers, compare with tolerance
  const na = Number(a), nb = Number(b);
  if (!isNaN(na) && !isNaN(nb) && a !== "" && b !== "") {
    // Use a small relative tolerance for floating-point ROUND() results
    const diff = Math.abs(na - nb);
    const maxVal = Math.max(Math.abs(na), Math.abs(nb), 1);
    return diff <= 0.005 * maxVal;  // 0.5% relative tolerance for rounded values
  }
  // String comparison
  return String(a) === String(b);
}

function fmtVal(v) {
  if (v == null) return "NULL";
  return String(v);
}

function displayValidation(subId, result, data) {
  const banner = document.getElementById("validationBanner");
  if (!banner) return;
  const cls = result.status === "correct" || result.status === "technique" ? "correct" : result.status === "incorrect" ? "incorrect" : "error";
  const icon = result.status === "correct" ? "✓" : result.status === "technique" ? "✓" : "✗";
  banner.className = "validation-banner visible " + cls;
  let html = `<div class="vb-head"><span class="vb-icon">${icon}</span> ${VALIDATION_LABELS[result.status] || result.status}</div>`;
  html += `<div class="vb-detail">${esc(result.summary)}</div>`;
  if (result.techniqueNote) {
    html += `<div class="vb-detail" style="margin-top:6px;font-size:12px;color:var(--text-secondary);">Your result is correct, but the requirements ask for a specific technique that does not appear in your query: ${esc(result.techniqueNote)}. Consider rewriting to use the required technique.</div>`;
  }
  if (result.status === "incorrect" && result.details.length) {
    html += `<div class="vb-detail" style="margin-top:8px;font-size:12px;color:var(--text-secondary);">` +
      `<strong>Diagnostics:</strong><br>` +
      result.details.slice(0, 8).map(d => "• " + esc(d)).join("<br>") +
      (result.details.length > 8 ? "<br>…and more." : "") + `</div>`;
  }
  if (data && data.elapsed_ms) {
    html += `<div style="margin-top:6px;font-size:11px;color:var(--text-muted);">Executed in ${data.elapsed_ms} ms. Your result: ${data.user.rowCount} row(s) × ${data.user.columns.length} col(s). Reference: ${data.reference.rowCount} row(s) × ${data.reference.columns.length} col(s).</div>`;
  }
  banner.innerHTML = html;
}

function restoreValidationBanner(subId) {
  const banner = document.getElementById("validationBanner");
  if (!banner) return;
  const v = state.validation[subId];
  if (!v) return;
  const cls = v.status === "correct" ? "correct" : v.status === "incorrect" ? "incorrect" : v.status === "error" ? "error" : "unavailable";
  const icon = v.status === "correct" ? "✓" : v.status === "incorrect" ? "✗" : "⚠";
  banner.className = "validation-banner visible " + cls;
  banner.innerHTML = `<div class="vb-head"><span class="vb-icon">${icon}</span> ${VALIDATION_LABELS[v.status] || v.status} <span style="font-weight:400;font-size:11px;color:var(--text-muted);">(last submitted ${new Date(v.at).toLocaleString()})</span></div><div class="vb-detail">${esc(v.message || "")}</div>`;
}

function onSearchInput(val) { state.filters.search = val; renderExerciseList(); }
function onFilterChange() {
  state.filters.difficulty = document.getElementById("filterDifficulty")?.value||"";
  state.filters.category = document.getElementById("filterCategory")?.value||"";
  state.filters.status = document.getElementById("filterStatus")?.value||"";
  renderExerciseList();
}

function renderExerciseList() {
  const container = document.getElementById("exerciseList");
  if (!container) return;
  const filtered = getFilteredSubs();
  if (filtered.length===0) {
    container.innerHTML = `<div class="empty-state"><h3>No sub-exercises match your filters</h3><p>Try adjusting the search or filter criteria.</p></div>`;
    return;
  }
  const grouped = {};
  for (const {sub,parent} of filtered) {
    if (!grouped[parent.id]) grouped[parent.id]={parent,subs:[]};
    grouped[parent.id].subs.push(sub);
  }
  let html = "";
  for (const pid in grouped) {
    const {parent,subs} = grouped[pid];
    const pp = getParentProgress(parent);
    html += `<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;"><span class="badge badge-${parent.difficulty.toLowerCase()}">${parent.difficulty}</span> ${esc(parent.title)} <span style="font-size:11px;color:var(--text-muted);">(${pp.done}/${pp.total})</span></div>`;
    for (const s of subs) {
      const status = state.completed[s.id]?"completed":(state.answers[s.id]&&state.answers[s.id].trim()?"saved":"pending");
      const label = state.completed[s.id]?"Completed":(state.answers[s.id]&&state.answers[s.id].trim()?"Saved":"Not started");
      html += `<div class="sub-list-item" onclick="navigateTo('${s.id}')"><span class="sub-num">${s.id.split('-s')[1]}</span><span class="sub-title">${esc(s.title)}</span><span class="sub-status ${status}">${label}</span></div>`;
    }
    html += `</div>`;
  }
  container.innerHTML = html;
}

/* ============================================================
   IMPORT / EXPORT / RESET
   ============================================================ */
function exportProgress() {
  const data = { exportedAt: new Date().toISOString(), version: 2, answers: state.answers, notes: state.notes, completed: state.completed, validation: state.validation };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "gayanara_sql_progress_"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("Progress exported as JSON.","success");
}

function importProgress() {
  const input = document.createElement("input");
  input.type="file"; input.accept=".json,application/json";
  input.onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data||typeof data!=="object") throw new Error("Invalid");
        if (data.answers&&typeof data.answers==="object") state.answers = data.answers;
        if (data.notes&&typeof data.notes==="object") state.notes = data.notes;
        if (data.completed&&typeof data.completed==="object") state.completed = data.completed;
        if (data.validation&&typeof data.validation==="object") state.validation = data.validation;
        saveState(); renderSidebar();
        if (state.currentView==="dashboard") renderDashboard();
        else if (SUB_MAP[state.currentView]) renderSub(state.currentView);
        else if (PARENTS.find(p=>p.id===state.currentView)) renderParent(state.currentView);
        else renderDashboard();
        showToast("Progress imported successfully.","success");
      } catch(err) {
        showToast("Import failed: file does not contain valid progress data.","error");
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetAllProgress() {
  if (!confirm("Reset ALL progress? All answers, notes, completion statuses, and validation results will be deleted. This cannot be undone.")) return;
  state.answers={}; state.notes={}; state.completed={}; state.validation={};
  saveState(); renderSidebar();
  if (state.currentView==="dashboard") renderDashboard();
  else if (SUB_MAP[state.currentView]) renderSub(state.currentView);
  else renderDashboard();
  showToast("All progress has been reset.","success");
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  loadState();
  renderSidebar();
  renderDashboard();
}
document.addEventListener("DOMContentLoaded", init);
</script>
